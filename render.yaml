# Configuración del despliegue en Render (Blueprint).
# Render construye la imagen con el Dockerfile y comprueba /health.
services:
  - type: web
    name: manuel-sastre-cv
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # sync: false hace que Render pida el valor en su panel: no está en Git.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Render está detrás de Cloudflare, que escribe aquí la IP real.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
