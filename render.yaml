# Configuración del despliegue en Render (Blueprint).
# Render construye la imagen con el Dockerfile y comprueba /health.
services:
  - type: web
    name: manuel-sastre-cv
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # sync: false hace que Render pida el valor en su panel: no está en Git.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Render está detrás de Cloudflare, que escribe aquí la IP real.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # Página privada de estadísticas (/admin/stats). Sin valor, la página no existe.
      # Usa un token largo y aleatorio (al menos 20 caracteres).
      - key: ADMIN_TOKEN
        sync: false
      # PostgreSQL (Neon) solo para las estadísticas del chat, para que no se
      # pierdan al reiniciar. Sin valor, las estadísticas quedan solo en memoria.
      - key: STATS_DATABASE_URL
        sync: false
      # Sal secreta del hash de las IPs que guardan los límites del chat en
      # PostgreSQL. La genera Render (aleatoria) y no hay que tocarla: si cambia,
      # los límites por IP empiezan de cero.
      - key: LIMITS_HASH_SALT
        generateValue: true
      # Límites del chat. Para cambiarlos, edita el valor en el panel de Render.
      - key: CHAT_MESSAGES_PER_MINUTE_PER_IP
        value: "5"
      - key: CHAT_MESSAGES_PER_DAY_PER_IP
        value: "30"
      - key: CHAT_MESSAGES_PER_DAY_TOTAL
        value: "300"
      - key: CHAT_MAX_MESSAGE_LENGTH
        value: "500"
