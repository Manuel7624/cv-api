{"name":"Despertador","on":{"schedule":[{"cron":"55 4 * * *"},{"cron":"55 5 * * *"}],"workflow_dispatch":{}},"jobs":{"despertar":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"name":"Despertar la web","run":"for i in $(seq 1 20); do code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' -H 'Accept: text/html,application/xhtml+xml' -H 'Accept-Language: es-ES,es;q=0.9' https://manuel-sastre-cv.onrender.com/); echo \"intento $i: $code\"; if [ \"$code\" = \"200\" ]; then exit 0; fi; sleep 15; done; exit 1"}]}}}
